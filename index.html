  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Glyphs — Dev Preview</title>
    <style>
      html,body,#root { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        background: linear-gradient(180deg,#0f172a 0%, #0b1220 60%);
        color: #e6eef8;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: min(920px,94vw);
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.04);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      }
      a { color: #ffd166; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .grid { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }
      .file {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.03);
        padding:8px 12px;
        border-radius:8px;
        font-family: monospace;
        color: #cfe8ff;
      }
      .btn {
        display:inline-block;
        padding:8px 14px;
        background: linear-gradient(90deg,#ff7aa2,#c084fc);
        color:white;
        border-radius:10px;
        text-decoration:none;
        font-weight:600;
        margin-top:12px;
      }
    </style>
  </head>
